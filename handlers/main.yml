---

- name: daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
    force: true
  notify: restart zot
  when:
    - ansible_facts.service_mgr == 'systemd'

- name: restart zot
  become: true
  ansible.builtin.service:
    name: zot
    state: restarted
  when:
    - not running_in_check_mode

- name: reload zot
  become: true
  ansible.builtin.service:
    name: zot
    state: reloaded
  when:
    - not running_in_check_mode

...
