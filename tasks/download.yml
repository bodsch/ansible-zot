- name: find extracted binaries
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.find:
    paths: "{{ zot_local_tmp_directory }}"
    file_type: file
    patterns:
      - "zot*"
    recurse: false
  register: found_binaries
  no_log: true

- name: define monitoring_plugins_directory
  when:
    - found_binaries.files is defined
    - found_binaries.files | count > 0
  ansible.builtin.set_fact:
    stat_zot_extracted_file: "{{ found_binaries.files | sort(attribute='path', reverse=True) | map(attribute='path') | list | first }}"

- name: rename zot binary
  when:
    - not running_in_check_mode
    - stat_zot_extracted_file | default('') | string | length > 0
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.copy:
    src: "{{ stat_zot_extracted_file }}"
    dest: "{{ zot_local_tmp_directory }}/{{ zot_release.binary }}"
    mode: "0755"
    remote_src: "{{ ('true' if zot_direct_download else 'false') | bool }}"
