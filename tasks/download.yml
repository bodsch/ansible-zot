---

- name: define download information
  when:
    - not running_in_check_mode
  ansible.builtin.set_fact:
    zot_release: "{{ zot_defaults_release | combine(zot_release, recursive=True) }}"
  no_log: true

- name: resolve zot release
  when:
    - not running_in_check_mode
  become: false
  delegate_to: localhost
  run_once: true
  bodsch.scm.scm_release:
    provider: "{{ zot_release.provider }}"
    host: "{{ zot_release.host }}"
    project: "{{ zot_release.project }}"
    repository: "{{ zot_release.repository }}"
    version: "{{ zot_version }}"
    asset: "zot-{{ ansible_facts.system | lower }}-{{ system_architecture }}"
    architecture: "{{ system_architecture }}"
    system: "{{ ansible_facts.system }}"
    user: "{{ _zot_scm_user | default(omit, true) }}"
    password: "{{ _zot_scm_token | default(omit, true) }}"
  register: _zot_release

- name: re-define zot_version
  when:
    - not running_in_check_mode
    - zot_version == "latest"
    - _zot_release.version is defined
    - _zot_release.version | length > 0
  ansible.builtin.set_fact:
    zot_version: "{{ _zot_release.version }}"

- name: define delegate instance for download handling
  when:
    - not running_in_check_mode
    - zot_direct_download
  ansible.builtin.set_fact:
    zot_delegate_to: "{{ ansible_facts.host }}"
    zot_local_tmp_directory: "{{
      lookup('env', 'CUSTOM_LOCAL_TMP_DIRECTORY') |
      default('/var/cache/ansible/zot', true) }}/{{ zot_version }}"

- name: create download directory
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.file:
    path: "{{ zot_local_tmp_directory }}"
    state: directory
    mode: "0700"
  check_mode: false

- name: detect the downloaded zot archive
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ zot_local_tmp_directory }}/{{ _zot_release.file }}"
  register: zot_stat_archive

- name: download
  when:
    - not running_in_check_mode
    - zot_stat_archive.stat is defined
    - not zot_stat_archive.stat.exists | default(false) | bool
  block:
    - name: download zot binary archive
      become: false
      delegate_to: "{{ zot_delegate_to }}"
      run_once: "{{ 'false' if zot_direct_download else 'true' }}"
      ansible.builtin.get_url:
        url: "{{ _zot_release.download_url }}"
        url_username: "{{ _zot_scm_user | default(omit, true) }}"
        url_password: "{{ _zot_scm_token | default(omit, true) }}"
        dest: "{{ zot_local_tmp_directory }}/{{ _zot_release.file }}"
        checksum: "{{ _zot_release.checksum_string | default(omit) }}"
        mode: "0640"
      register: _download_archive
      until: _download_archive is succeeded
      retries: 5
      delay: 2
      check_mode: false

  rescue:
    - name: delete download directory
      become: false
      delegate_to: "{{ zot_delegate_to }}"
      run_once: "{{ 'false' if zot_direct_download else 'true' }}"
      ansible.builtin.file:
        path: "{{ zot_local_tmp_directory }}"
        state: absent

    - name: exit with fail
      ansible.builtin.fail:
        msg: A serious error occurred when downloading the archive.

- name: detect downloaded file
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ zot_local_tmp_directory }}/{{ _zot_release.file }}"
  register: zot_stat_archive

- name: detect extracted binary
  when:
    - not running_in_check_mode
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.stat:
    path: "{{ zot_local_tmp_directory }}/{{ zot_release.binary }}"
  register: zot_stat_binary

- name: extract zot archive
  when:
    - not running_in_check_mode
    - zot_stat_archive.stat is defined
    - zot_stat_archive.stat.exists | default('false') | bool
    - zot_stat_archive.stat.mimetype in ["application/zip","application/gzip"]
    - zot_stat_binary.stat is defined
    - not zot_stat_binary.stat.exists | default('false') | bool
  become: false
  delegate_to: "{{ zot_delegate_to }}"
  run_once: "{{ 'false' if zot_direct_download else 'true' }}"
  ansible.builtin.unarchive:
    src: "{{ zot_local_tmp_directory }}/{{ _zot_release.file }}"
    dest: "{{ zot_local_tmp_directory }}/"
    remote_src: "{{ 'true' if zot_direct_download else 'false' }}"

...
