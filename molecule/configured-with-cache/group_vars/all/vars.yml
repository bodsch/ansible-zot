---

zot_config:
  distSpecVersion: "1.1.1"
  storage:
    rootDirectory: /var/cache/zot
    remoteCache: true
    cacheDriver:
      name: redis
      url: "redis://127.0.0.1:6379"
      keyprefix: "zot"
  http:
    address: "127.0.0.1"
    port: "8080"
  log:
    level: "debug"
  extensions:
    metrics:
      enable: true
      prometheus:
        path: /metrics

...
